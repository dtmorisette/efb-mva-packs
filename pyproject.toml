[project]
name = "efb-mva-packs"
version = "1.0.0"
description = "Build FAA MVA/MIA ForeFlight content packs from FAA source data"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["shapely>=2.0", "pillow>=9.0", "pyyaml>=6.0"]

[project.scripts]
mvapacks = "mvapacks.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
